[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treps-sdk"
version = "0.1.0"
description = "Official Python SDK for the Treps Payment Orchestration Platform — Authentication, Financial Transactions, 3D Secure, Secure Payment Page (Hosted Page), Query Operations, Card Operations, Payment Links, and Insurance-sector Payments."
readme = "README.md"
license = "MIT"
authors = [{ name = "Treps Payment Orchestration Platform" }]
requires-python = ">=3.10"
keywords = ["treps", "payment", "payment-orchestration", "3d-secure", "hosted-page", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3"]

[project.urls]
Homepage = "https://github.com/TrepsPaymentOrchestration/python-sdk"
Repository = "https://github.com/TrepsPaymentOrchestration/python-sdk"
Issues = "https://github.com/TrepsPaymentOrchestration/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/treps"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
